<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bluey · Votaciones Seguras</title>
    <!-- CryptoJS (CDN para AES-128) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1b4d6e 0%, #2a6f96 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            padding: 20px;
        }

        /* Tarjeta principal con animación de entrada */
        .card {
            max-width: 500px;
            width: 100%;
            background: #fef3e2;
            border-radius: 48px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            transition: all 0.3s ease;
            animation: fadeSlideUp 0.6s ease-out;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Encabezado estilo Bluey */
        .bluey-header {
            background: #1e6091;
            padding: 1rem;
            text-align: center;
            border-bottom: 5px solid #f4a261;
        }

        .bluey-header h1 {
            color: #FFE8C5;
            text-shadow: 3px 3px 0 #c16f2e;
            font-size: 2rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .bluey-header h1 span {
            font-size: 2rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Contenido */
        .content {
            padding: 2rem;
        }

        .info-text {
            background: #e2d5b6;
            border-radius: 30px;
            padding: 0.8rem;
            text-align: center;
            margin-bottom: 1.8rem;
            font-weight: bold;
            color: #2d4a6e;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #1e3c5c;
            font-size: 1rem;
        }

        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #f4a261;
            border-radius: 28px;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
            background: white;
            transition: all 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #e76f51;
            box-shadow: 0 0 0 3px rgba(231,111,81,0.2);
        }

        .btn-votar {
            background-color: #f4a261;
            border: none;
            color: #1e3c72;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 14px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 0 #c76e2e;
            font-family: inherit;
            width: 100%;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-votar:hover {
            background-color: #e76f51;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #c76e2e;
        }

        .btn-votar:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #c76e2e;
        }

        /* Área de resultados */
        .result {
            margin-top: 1.8rem;
            background: #1e3c5c;
            border-radius: 28px;
            padding: 1rem;
            color: #f0e6c5;
            font-size: 0.85rem;
            word-break: break-word;
            font-family: monospace;
            display: none;
        }

        .result.show {
            display: block;
            animation: fadeIn 0.4s;
        }

        .result.success {
            background: #2a7a3e;
            border-left: 8px solid #a5e0a5;
        }

        .result.error {
            background: #9e2d2f;
            border-left: 8px solid #ffb4a2;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #1e3c72;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            padding: 1rem;
            background: #d9cba3;
            font-size: 0.7rem;
            color: #5b4b2e;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="bluey-header">
        <h1>
            <span>🐾</span> Bluey Vota <span>🦴</span>
        </h1>
        <div class="info-text">
            ✨ Ingresa tu boleta, se cifrará automáticamente con AES-128 ✨
        </div>
    </div>

    <div class="content">
        <div class="form-group">
            <label>📝 Boleta electoral (texto plano):</label>
            <textarea id="boletaInput" rows="4" placeholder="Escribe o pega el contenido de tu boleta aquí..."></textarea>
        </div>

        <button class="btn-votar" id="enviarBtn">
            🗳️  Enviar voto cifrado  🔒
        </button>

        <!-- Área para mostrar respuesta del servidor -->
        <div id="resultArea" class="result"></div>
    </div>

    <footer>
        🔐 Cifrado AES-128-CBC · Voto secreto
    </footer>
</div>

<script>
    // --------------------------------------------------------------
    // 1. CONFIGURACIÓN DE CIFRADO (AES-128-CBC con PKCS7)
    //    Clave e IV proporcionadas por el usuario:
    //    Clave: 9QtBteWKKZaNFD2S
    //    IV:    mAQZptX9oOGIkQHS
    // --------------------------------------------------------------
    const SECRET_KEY = "9QtBteWKKZaNFD2S";     // 16 bytes exactos para AES-128
    const INIT_VECTOR = "mAQZptX9oOGIkQHS";    // 16 bytes exactos para CBC

    // Convertir las cadenas a formato WordArray que CryptoJS entiende
    const keyWordArray = CryptoJS.enc.Utf8.parse(SECRET_KEY);
    const ivWordArray = CryptoJS.enc.Utf8.parse(INIT_VECTOR);

    /**
     * Función para cifrar texto plano usando AES-128-CBC
     * @param {string} plaintext - Texto a cifrar
     * @returns {string} - Texto cifrado en formato Base64 (compatible con la mayoría de backends)
     */
    function encryptAES128(plaintext) {
        // Configuración explícita: CBC mode, PKCS7 padding
        const encrypted = CryptoJS.AES.encrypt(plaintext, keyWordArray, {
            iv: ivWordArray,
            mode: CryptoJS.mode.CBC,
            padding: CryptoJS.pad.Pkcs7
        });
        // Devuelve el ciphertext en formato Base64 (string)
        return encrypted.toString();
    }

    // --------------------------------------------------------------
    // 2. MANEJAR EL ENVÍO DEL FORMULARIO
    // --------------------------------------------------------------
    const enviarBtn = document.getElementById('enviarBtn');
    const boletaInput = document.getElementById('boletaInput');
    const resultArea = document.getElementById('resultArea');

    enviarBtn.addEventListener('click', async () => {
        // Ocultar resultado anterior
        resultArea.classList.remove('show', 'success', 'error');
        resultArea.innerHTML = '';

        const boleta = boletaInput.value.trim();

        // Validación: no puede estar vacía
        if (!boleta) {
            mostrarResultado('❌ Por favor, escribe el contenido de la boleta antes de enviar.', 'error');
            return;
        }

        // Mostrar estado de carga en el botón
        const originalBtnText = enviarBtn.innerHTML;
        enviarBtn.innerHTML = '<span class="spinner"></span> Cifrando y enviando...';
        enviarBtn.disabled = true;

        try {
            // 1) Cifrar la boleta con AES-128
            const boletaCifrada = encryptAES128(boleta);
            console.log("✅ Boleta cifrada (Base64):", boletaCifrada);

            // 2) Construir el JSON con el formato requerido:
            //    { "votante": "texto_cifrado_en_base64" }
            const payload = {
                votante: boletaCifrada
            };

            // 3) Realizar la petición POST al servidor de verificación
            const response = await fetch('https://votacion-server.vercel.app/verificar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            // 4) Procesar la respuesta del servidor (asumimos JSON)
            let responseData;
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
                responseData = await response.json();
            } else {
                // Si no es JSON, leemos como texto para mostrar error útil
                const textResp = await response.text();
                throw new Error(`El servidor respondió con: ${textResp.substring(0, 150)}`);
            }

            if (response.ok) {
                // Éxito: mostramos respuesta bonita
                mostrarResultado(
                    `✅ ¡Voto recibido correctamente!<br><br>📦 Respuesta del servidor:<br><code style="background:#2c5a2a; padding:4px 6px; border-radius:12px; display:inline-block;">${JSON.stringify(responseData, null, 2)}</code>`,
                    'success'
                );
                // Opcional: limpiar el textarea después de éxito
                // boletaInput.value = '';
            } else {
                // Error controlado por el servidor (ej. 400, 500)
                mostrarResultado(
                    `⚠️ Error del servidor (${response.status}):<br><code style="background:#631e1f; padding:4px 6px; border-radius:12px;">${JSON.stringify(responseData) || 'Sin detalles adicionales'}</code>`,
                    'error'
                );
            }

        } catch (error) {
            console.error('Error en el proceso:', error);
            mostrarResultado(
                `❌ Falló la conexión o el cifrado.<br>🔍 Detalle técnico: ${error.message}<br><br>✉️ Verifica que el servidor esté accesible y que el formato sea correcto.`,
                'error'
            );
        } finally {
            // Restaurar botón
            enviarBtn.innerHTML = originalBtnText;
            enviarBtn.disabled = false;
        }
    });

    /**
     * Muestra mensajes en el área de resultados con estilo
     */
    function mostrarResultado(mensaje, tipo = 'success') {
        resultArea.innerHTML = mensaje;
        resultArea.classList.add('show', tipo);
        // Scroll suave hacia el resultado
        resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Pequeño helper: si el usuario presiona Ctrl+Enter (Cmd+Enter) enviar
    boletaInput.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            enviarBtn.click();
        }
    });
</script>
</body>
</html>
