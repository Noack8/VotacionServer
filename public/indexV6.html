<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Noack · Votaciones Seguras (Debug con firma + urna)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #1b4d6e 0%, #2a6f96 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            padding: 20px;
        }
        .card {
            max-width: 900px;
            width: 100%;
            background: #fef3e2;
            border-radius: 48px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: fadeSlideUp 0.6s ease-out;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bluey-header {
            background: #1e6091;
            padding: 1rem;
            text-align: center;
            border-bottom: 5px solid #f4a261;
        }
        .bluey-header h1 {
            color: #FFE8C5;
            text-shadow: 3px 3px 0 #c16f2e;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .info-text {
            background: #e2d5b6;
            border-radius: 30px;
            padding: 0.8rem;
            text-align: center;
            margin-bottom: 1.8rem;
            font-weight: bold;
            color: #2d4a6e;
        }
        .content {
            padding: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #1e3c5c;
        }
        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #f4a261;
            border-radius: 28px;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
        }
        .btn-votar {
            background-color: #f4a261;
            border: none;
            color: #1e3c72;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 14px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 0 #c76e2e;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-votar:hover { background-color: #e76f51; transform: translateY(-2px); box-shadow: 0 7px 0 #c76e2e; }
        .result {
            margin-top: 1.8rem;
            background: #1e3c5c;
            border-radius: 28px;
            padding: 1rem;
            color: #f0e6c5;
            font-size: 0.85rem;
            word-break: break-word;
            display: none;
        }
        .result.show { display: block; }
        .result.success { background: #2a7a3e; border-left: 8px solid #a5e0a5; }
        .result.error { background: #9e2d2f; border-left: 8px solid #ffb4a2; }
        .result.debug { background: #3a6b92; border-left: 8px solid #f4d03f; }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #1e3c72;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        footer {
            text-align: center;
            padding: 1rem;
            background: #d9cba3;
            font-size: 0.7rem;
            color: #5b4b2e;
        }
        .voting-section {
            margin-top: 2rem;
            border-top: 2px solid #f4a261;
            padding-top: 1.5rem;
        }
        .section-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #1e6091;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .candidates {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }
        .candidate-card {
            background: white;
            border-radius: 28px;
            padding: 1rem;
            width: 150px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 3px solid transparent;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .candidate-card.selected {
            border-color: #f4a261;
            background: #fff0e0;
            transform: scale(1.02);
        }
        .candidate-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 0.5rem;
        }
        .candidate-name {
            font-weight: bold;
            font-size: 1rem;
        }
        .finalizar-btn {
            background-color: #2a7a3e;
            margin-top: 2rem;
            box-shadow: 0 5px 0 #1e5a2e;
        }
        .finalizar-btn:hover { background-color: #1e5a2e; }
        .hidden { display: none; }
        .debug-badge {
            background: #f4d03f;
            color: #1e3c5c;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: bold;
            display: inline-block;
            margin-left: 10px;
        }
        pre {
            background: #2c3e50;
            padding: 12px;
            border-radius: 16px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 12px;
            color: #f0e6c5;
            margin: 8px 0;
        }
        code {
            background: #2c3e50;
            padding: 2px 4px;
            border-radius: 6px;
            font-family: monospace;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="bluey-header">
        <h1><span>🦊</span> Padron electoral 2026 Noack <span>🐈</span>
            <span class="debug-badge">MODO DEBUG + FIRMA</span>
        </h1>
        <div class="info-text">✨ Elecciones 2026 para Presidente, Alcalde y Diputado ✨</div>
    </div>
    <div class="content">
        <!-- Paso 1: Ingreso de boleta -->
        <div id="step1">
            <div class="form-group">
                <label>📝 Boleta electoral:</label>
                <textarea id="boletaInput" rows="2" placeholder="Escribe aquí tu boleta"></textarea>
            </div>
            <button class="btn-votar" id="enviarBtn">🗳️ Verificar votante 🔒</button>
        </div>

        <!-- Paso 2: Interfaz de votación (inicialmente oculta) -->
        <div id="step2" class="hidden">
            <div id="votingContainer"></div>
            <button class="btn-votar finalizar-btn" id="finalizarBtn">✅ Finalizar votación (DEBUG - con firma)</button>
        </div>

        <div id="resultArea" class="result"></div>
    </div>
    <footer>🔐 Verificación SHA256 · Votos: firma + " nombre" (o solo firma si nulo) · AES-128-CBC</footer>
</div>

<script>
    // --- Configuración de cifrado AES-128-CBC ---
    const SECRET_KEY = "9QtBteWKKZaNFD2S";
    const INIT_VECTOR = "mAQZptX9oOGIkQHS";
    const keyWordArray = CryptoJS.enc.Utf8.parse(SECRET_KEY);
    const ivWordArray = CryptoJS.enc.Utf8.parse(INIT_VECTOR);

    // --- Firma constante para todos los votos ---
    const FIRMA = "128ehdub19d1iidn12dn";

    function encryptAES128(plaintext) {
        if (plaintext === null || plaintext === undefined) return null;
        const encrypted = CryptoJS.AES.encrypt(plaintext, keyWordArray, {
            iv: ivWordArray,
            mode: CryptoJS.mode.CBC,
            padding: CryptoJS.pad.Pkcs7
        });
        return encrypted.toString();
    }

    // Validación de formato de boleta (opcional)
    function isValidBoleta(boleta) {
        return /^\d{4}64\d{4}$/.test(boleta);
    }

    // Datos de ejemplo para las votaciones (3 secciones, 3 opciones cada una)
    const secciones = [
        {
            nombre: "Presidente",
            candidatos: [
                { id: "pres1", nombre: "Juan Pérez", imagen: "/imagenes/JuanPerez.jpg" },
                { id: "pres2", nombre: "María López", imagen: "/imagenes/MariaLopez.jpg" },
                { id: "pres3", nombre: "Carlos Ruiz", imagen: "/imagenes/CarlosRuiz.jpg" }
            ]
        },
        {
            nombre: "Alcalde",
            candidatos: [
                { id: "alc1", nombre: "Ana Gómez", imagen: "/imagenes/AnaGomez.jpg" },
                { id: "alc2", nombre: "Luis Fernández", imagen: "/imagenes/LuisFernandez.jpg" },
                { id: "alc3", nombre: "Sofía Martínez", imagen: "/imagenes/SofiaMartinez.jpg" }
            ]
        },
        {
            nombre: "Diputado",
            candidatos: [
                { id: "dip1", nombre: "Pedro Rojas", imagen: "/imagenes/PedroRojas.jpg" },
                { id: "dip2", nombre: "Laura Silva", imagen: "/imagenes/LauraSilva.jpg" },
                { id: "dip3", nombre: "Diego Castro", imagen: "/imagenes/DiegoCastro.jpg" }
            ]
        }
    ];

    let identificadorHashGlobal = "";     // Almacena el hash SHA256 de boleta + texto fijo
    let selecciones = {};                 // Guarda los IDs seleccionados (pres1, alc2, etc.) o null
    let nombresSeleccionados = {};        // Guarda los nombres reales de los candidatos o null

    // Renderizar las opciones de votación
    function renderVotingUI() {
        const container = document.getElementById("votingContainer");
        container.innerHTML = "";
        selecciones = {};
        nombresSeleccionados = {};

        secciones.forEach((seccion, idx) => {
            const sectionDiv = document.createElement("div");
            sectionDiv.className = "voting-section";
            sectionDiv.innerHTML = `<div class="section-title">${seccion.nombre}</div>`;
            const candidatesDiv = document.createElement("div");
            candidatesDiv.className = "candidates";
            
            seccion.candidatos.forEach(cand => {
                const card = document.createElement("div");
                card.className = "candidate-card";
                card.dataset.seccion = idx;
                card.dataset.candidatoId = cand.id;
                card.dataset.candidatoNombre = cand.nombre;
                card.innerHTML = `
                    <img src="${cand.imagen}" alt="${cand.nombre}" onerror="this.src='https://via.placeholder.com/100'">
                    <div class="candidate-name">${cand.nombre}</div>
                `;
                card.addEventListener("click", () => {
                    // Toggle: si ya está seleccionado, lo deseleccionamos
                    if (card.classList.contains("selected")) {
                        card.classList.remove("selected");
                        selecciones[idx] = null;
                        nombresSeleccionados[idx] = null;
                    } else {
                        document.querySelectorAll(`.candidate-card[data-seccion='${idx}']`).forEach(c => c.classList.remove("selected"));
                        card.classList.add("selected");
                        selecciones[idx] = cand.id;
                        nombresSeleccionados[idx] = cand.nombre;
                    }
                });
                candidatesDiv.appendChild(card);
            });
            sectionDiv.appendChild(candidatesDiv);
            container.appendChild(sectionDiv);
        });
    }

    // Mostrar mensajes
    function mostrarResultado(mensaje, tipo = 'success') {
        const resultArea = document.getElementById("resultArea");
        resultArea.innerHTML = mensaje;
        resultArea.classList.add("show", tipo);
        resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function ocultarResultado() {
        const resultArea = document.getElementById("resultArea");
        resultArea.classList.remove("show", "success", "error", "debug");
        resultArea.innerHTML = "";
    }

    // --- Evento principal: verificar boleta usando SHA256 ---
    document.getElementById("enviarBtn").addEventListener("click", async () => {
        ocultarResultado();
        const boletaPlana = document.getElementById("boletaInput").value.trim();

        if (!boletaPlana) {
            mostrarResultado("❌ Por favor ingresa una boleta.", "error");
            return;
        }

        // Calcular SHA256 de (boleta + " Sistema de votaciones 2026")
        const textoConstante = " Sistema de votaciones 2026";
        const concatenado = boletaPlana + textoConstante;
        const hashSha256 = CryptoJS.SHA256(concatenado).toString();
        identificadorHashGlobal = hashSha256;

        const btn = document.getElementById("enviarBtn");
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="spinner"></span> Verificando hash...';
        btn.disabled = true;

        try {
            const response = await fetch('/verificar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ votante: identificadorHashGlobal })
            });
            const data = await response.json();

            if (response.ok) {
                if (data.mensaje === "Votante no encontrado puede votar") {
                    document.getElementById("step1").classList.add("hidden");
                    document.getElementById("step2").classList.remove("hidden");
                    renderVotingUI();
                    mostrarResultado("✅ Boleta válida. Ahora puedes seleccionar tus candidatos (puedes dejar campos vacíos).", "success");
                } else if (data.mensaje === "Votante encontrado, solo se puede votar una sola vez") {
                    mostrarResultado("❌ Este votante ya ha emitido su voto. No se puede votar nuevamente.", "error");
                } else {
                    mostrarResultado("⚠️ Respuesta inesperada del servidor.", "error");
                }
            } else {
                mostrarResultado(`❌ Error del servidor: ${data.error || "Desconocido"}`, "error");
            }
        } catch (err) {
            mostrarResultado(`❌ Error de conexión: ${err.message}`, "error");
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    });

    // --- Evento Finalizar votación: MODO DEBUG con firma ---
    document.getElementById("finalizarBtn").addEventListener("click", async () => {
        // Ya no se verifica si hay faltantes; se permiten nulos

        // 1. Hash con "Noack" (col5)
        const cadenaUsuario = `${identificadorHashGlobal} Noack`;
        const Chain1 = CryptoJS.SHA256(cadenaUsuario).toString();

        // 2. Urna aleatoria y hash con palabra "urna" (col6)
        const urna = Math.floor(Math.random() * 3) + 1;
        const cadenaParaHash = `${Chain1} urna ${urna}`;
        const Chain2 = CryptoJS.SHA256(cadenaParaHash).toString();

        // 3. Base de datos aleatoria y hash con "BD" (col7)
        const bd = Math.floor(Math.random() * 3) + 1;
        const cadenaBaseDatos = `${Chain2} BD ${bd}`;
        const Chain3 = CryptoJS.SHA256(cadenaBaseDatos).toString();

        // --- Construir el texto plano para cada voto (firma + nombre o solo firma) ---
        const nombrePresidente = nombresSeleccionados[0] !== undefined ? nombresSeleccionados[0] : null;
        const nombreAlcalde = nombresSeleccionados[1] !== undefined ? nombresSeleccionados[1] : null;
        const nombreDiputado = nombresSeleccionados[2] !== undefined ? nombresSeleccionados[2] : null;

        let plainPresidente = FIRMA;
        let plainAlcalde = FIRMA;
        let plainDiputado = FIRMA;

        if (nombrePresidente !== null) plainPresidente = FIRMA + " " + nombrePresidente;
        if (nombreAlcalde !== null) plainAlcalde = FIRMA + " " + nombreAlcalde;
        if (nombreDiputado !== null) plainDiputado = FIRMA + " " + nombreDiputado;

        // Cifrar cada texto plano
        const col2 = encryptAES128(plainPresidente);
        const col3 = encryptAES128(plainAlcalde);
        const col4 = encryptAES128(plainDiputado);

        // col1 es el identificador hash del votante
        const col1 = identificadorHashGlobal;
        const col5 = Chain1;
        const col6 = Chain2;
        const col7 = Chain3;

        const payload = {
            col1, col2, col3, col4, col5, col6, col7
        };

        // Información adicional para depuración (mostrar texto plano y cifrado)
        const infoExtra = `
            <strong>🔍 Detalles de la generación (con firma):</strong><br>
            • Firma constante: <code>${FIRMA}</code><br>
            • Firma de la boleta: <code>${identificadorHashGlobal}</code><br>
            • Urna elegida: <strong>${urna}</strong><br>
            • Base de datos elegida: <strong>${bd}</strong><br>
            <br>
            <strong>🗳️ Voto Presidente:</strong><br>
            &nbsp;&nbsp;Texto plano: <code>${escapeHtml(plainPresidente)}</code><br>
            &nbsp;&nbsp;Cifrado (col2): <code>${col2}</code><br>
            <strong>🗳️ Voto Alcalde:</strong><br>
            &nbsp;&nbsp;Texto plano: <code>${escapeHtml(plainAlcalde)}</code><br>
            &nbsp;&nbsp;Cifrado (col3): <code>${col3}</code><br>
            <strong>🗳️ Voto Diputado:</strong><br>
            &nbsp;&nbsp;Texto plano: <code>${escapeHtml(plainDiputado)}</code><br>
            &nbsp;&nbsp;Cifrado (col4): <code>${col4}</code><br>
            <br>
            <strong>🔗 Cadenas de trazabilidad:</strong><br>
            • Chain1 (col5): <code>${col5}</code><br>
            • Chain2 (col6): <code>${col6}</code><br>
            • Chain3 (col7): <code>${col7}</code><br>
        `;

        const prettyJson = JSON.stringify(payload, null, 2);

        mostrarResultado(
            `🐞 MODO DEBUG - JSON que se enviaría al servidor:\n\n` +
            `<pre>${escapeHtml(prettyJson)}</pre>\n` +
            `<div style="background:#2c3e50; padding:10px; border-radius:12px; margin-top:12px;">${infoExtra}</div>\n` +
            `✅ (No se ha enviado ningún dato, solo simulación)`,
            "debug"
        );
    });

    // Función auxiliar para escapar HTML
    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
</script>
</body>
</html>
